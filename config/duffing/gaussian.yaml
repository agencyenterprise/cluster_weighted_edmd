name: duffing_gaussian
description: >
  Gaussian-distributed training data centered between the two foci.
  Tests how each method handles density that decays away from the origin.
system: duffing

seeds: [1, 42, 101, 307, 1001, 7789, 13245, 11, 103, 13]

data:
  distribution: gaussian
  n_train: 4000
  n_test:  1000
  mean:    [0.0, 0.0]
  sigma:   [1.0, 1.0]

fit: { n_iter: 80, n_restarts: 2 }
rollout:
  dt:            0.05
  rollout_steps: 400
  horizons: [1.0, 2.0, 5.0, 10.0, 20.0]
methods:
  N_list:     [2, 4, 8, 16]
  edmd_degs:  [2, 3, 4, 5]
  le2_N_list: [2, 4, 8, 16]
  le3_N_list: [2, 4, 8]
