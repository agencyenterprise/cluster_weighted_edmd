name: duffing_trajectory
description: >
  Trajectory-ensemble training: integrate from random ICs in a box, take
  all trajectory points as training. Damping concentrates density near
  the foci over time -- the Mauroy/Mezic isostable testbed setting.
system: duffing

seeds: [1, 42, 101, 307, 1001, 7789, 13245, 11, 103, 13]

data:
  distribution: trajectory
  n_train: 10200          # set indirectly: n_traj * (traj_steps + 1)
  n_test:  1000
  n_traj:     200
  traj_steps: 50
  dt:         0.05
  ic_x:       2.0
  ic_xdot:    2.5

fit: { n_iter: 80, n_restarts: 2 }
rollout:
  dt:            0.05
  rollout_steps: 400
  horizons: [1.0, 2.0, 5.0, 10.0, 20.0]
methods:
  N_list:     [2, 4, 8, 16]
  edmd_degs:  [2, 3, 4, 5]
  le2_N_list: [2, 4, 8, 16]
  le3_N_list: [2, 4, 8]
