name: duffing_dt_fast
description: >
  Time-discretization study: smaller dt=0.025 (half baseline). Reduces
  Euler-truncation error, exposing model error in the rollout panel.
  Doubled rollout_steps to keep total physical time the same.
system: duffing

seeds: [1, 42, 101, 307, 1001, 7789, 13245, 11, 103, 13]

data:
  distribution: uniform
  n_train: 4000
  n_test:  1000
  box_x:   2.0
  box_xdot: 2.0

fit: { n_iter: 80, n_restarts: 2 }
rollout:
  dt:            0.025
  rollout_steps: 800           # still 20 s total
  horizons: [1.0, 2.0, 5.0, 10.0, 20.0]
methods:
  N_list:     [2, 4, 8, 16]
  edmd_degs:  [2, 3, 4, 5]
  le2_N_list: [2, 4, 8, 16]
  le3_N_list: [2, 4, 8]
  le4_N_list: [2, 4]
  le5_N_list: [2, 4]
