# Duffing -- uniform sampling baseline.
#
# Default operating point. All other Duffing configs are perturbations
# of this one along a single axis to isolate its effect.

name: duffing_uniform_baseline
description: >
  Unforced double-well Duffing, uniform-on-box sampling, n_train=4000.
  Baseline configuration for all parameter-variation studies.
system: duffing

seeds: [1, 42, 101, 307, 1001, 7789, 13245, 11, 103, 13]

data:
  distribution: uniform
  n_train: 4000
  n_test:  1000
  box_x:   2.0
  box_xdot: 2.0

fit:
  n_iter:     80
  n_restarts: 2

rollout:
  dt:            0.05
  rollout_steps: 400          # 20 s at dt=0.05
  horizons: [1.0, 2.0, 5.0, 10.0, 20.0]

methods:
  N_list:     [2, 4, 8, 16]      # Taylor-analytic and GMM-baseline cluster counts
  edmd_degs:  [2, 3, 4, 5]       # Global EDMD-disc degrees (deg>=3 is polynomial-exact for Duffing)
  # Local-EDMD-disc cluster counts at each polynomial lift degree. deg=3
  # matches Duffing's exact-polynomial RHS — the apples-to-apples partition-
  # vs-global comparison. deg=4 and deg=5 also match the higher-degree global
  # baselines so the Pareto frontier is fully populated. Per-degree N is
  # reduced as deg grows because per-cluster cost scales as N * M^2 with
  # M = comb(2+deg, deg) (deg=5 -> M=21, M^2=441 per cluster).
  le2_N_list: [2, 4, 8, 16]
  le3_N_list: [2, 4, 8]
  le4_N_list: [2, 4]
  le5_N_list: [2, 4]
