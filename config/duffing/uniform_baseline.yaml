# Duffing -- uniform sampling baseline.
#
# Default operating point. All other Duffing configs are perturbations
# of this one along a single axis to isolate its effect.

name: duffing_uniform_baseline
description: >
  Unforced double-well Duffing, uniform-on-box sampling, n_train=4000.
  Baseline configuration for all parameter-variation studies.
system: duffing

seeds: [1, 42, 101, 307, 1001, 7789, 13245, 11, 103, 13]

data:
  distribution: uniform
  n_train: 4000
  n_test:  1000
  box_x:   2.0
  box_xdot: 2.0

fit:
  n_iter:     80
  n_restarts: 2

rollout:
  dt:            0.05
  rollout_steps: 400          # 20 s at dt=0.05
  horizons: [1.0, 2.0, 5.0, 10.0, 20.0]

methods:
  N_list:     [2, 4, 8, 16]
  edmd_degs:  [2, 3, 4, 5]
  le2_N_list: [2, 4, 8, 16]
  le3_N_list: [2, 4, 8]
