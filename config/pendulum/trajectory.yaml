name: pendulum_trajectory
description: >
  Trajectory-ensemble training: integrate from random ICs and use all
  trajectory points. Damping concentrates density toward (0, 0); ICs
  span both oscillation and rotation regimes.
system: pendulum
seeds: [1, 42, 101, 307, 1001, 7789, 13245, 11, 103, 13]
data:
  distribution: trajectory
  n_train: 10200      # 200 * 51
  n_test:  1000
  n_traj:     200
  traj_steps: 50
  dt:         0.05
  ic_theta:        3.14159265
  ic_thetadot:     3.0
fit: { n_iter: 100, n_restarts: 2 }
rollout:
  dt:            0.05
  rollout_steps: 200
  horizons: [1.0, 2.5, 5.0, 10.0]
methods:
  N_list:    [2, 4, 8, 16]
  edmd_degs: [2, 4, 6, 8]
  le_degrees: [2, 4]
