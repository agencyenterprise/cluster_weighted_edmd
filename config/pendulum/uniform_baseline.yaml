name: pendulum_uniform_baseline
description: >
  Damped pendulum, uniform-on-box phase-space sampling, n_train=4000.
  Baseline for all parameter-variation studies.
system: pendulum

seeds: [1, 42, 101, 307, 1001, 7789, 13245, 11, 103, 13]

data:
  distribution: uniform
  n_train: 4000
  n_test:  1000
  box_x:    3.14159265        # theta_max = pi
  box_xdot: 3.0
  n_traj_pairs:     100       # for discrete-EDMD trajectory pairs
  traj_steps_pairs:  50

fit: { n_iter: 100, n_restarts: 2 }
rollout:
  dt:            0.05
  rollout_steps: 200          # 10 s
  horizons: [1.0, 2.5, 5.0, 10.0]
methods:
  N_list:    [2, 4, 8, 16]
  edmd_degs: [2, 4, 6, 8]
  # Local-EDMD-disc polynomial degrees to test. Pendulum has no exact
  # polynomial degree (sin theta is non-polynomial), so the relevant
  # comparison is between Local-EDMD-disc at the SAME degree as the global
  # baseline rather than against a polynomial-exact floor. Adding deg=4
  # matches the global EDMD-disc deg=4 reference; higher degrees (6, 8)
  # blow up parameter count for the local variant (N * comb(2+8,8)^2 =
  # 32400 params at N=16) so we keep the comparison at 4.
  le_degrees: [2, 4]
