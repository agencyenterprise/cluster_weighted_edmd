name: lorenz_uniform_wide_box
description: >
  Uniform sampling on a 50x60x50 box covering a generous neighborhood
  of the attractor. Forces methods to handle off-attractor states.
system: lorenz
seeds: [1, 42, 101, 307, 1001, 7789, 13245, 11, 103, 13]
data:
  distribution: uniform
  n_train: 4000
  box_x:    25.0
  box_y:    30.0
  box_z:    25.0
  z_offset: 25.0
fit: { n_iter: 100, n_restarts: 2 }
rollout:
  dt:            0.01
  rollout_steps: 500
  horizons: [0.5, 1.0, 2.0, 5.0]
methods:
  N_list:    [5, 12, 20, 50]
  edmd_degs: [2, 3]
  le_degrees: [2, 3]
