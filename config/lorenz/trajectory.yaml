name: lorenz_trajectory
description: >
  Trajectory-ensemble training: integrate from random ICs in a wide box
  and use all trajectory points (not just attractor-resident points).
  Includes transient-phase samples that the legacy attractor sampler
  skips with its warmup.
system: lorenz
seeds: [1, 42, 101, 307, 1001, 7789, 13245, 11, 103, 13]
data:
  distribution: trajectory
  n_train: 5100             # 100 * 51
  n_traj:     100
  traj_steps:  50
  dt:         0.01
  ic_box:      20.0
  ic_z_offset: 25.0
fit: { n_iter: 100, n_restarts: 2 }
rollout:
  dt:            0.01
  rollout_steps: 500
  horizons: [0.5, 1.0, 2.0, 5.0]
methods:
  N_list:    [5, 12, 20, 50]
  edmd_degs: [2, 3]
  le_degrees: [2, 3]
