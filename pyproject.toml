[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-aware-clustering"
version = "0.1.0"
description = "Cluster-Weighted Model framework for piecewise dynamical modeling"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Lorenzo Tomaz", email = "lorenzo@ae.studio"},
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
pykoopman = [
    "pykoopman>=1.0",
    "pydmd>=1.0",
    "optht",
    "derivative",
    "lightning",
]
dev = [
    "pytest",
]

[tool.setuptools]
packages = ["residual_aware_clustering", "residual_aware_clustering.models",
            "residual_aware_clustering.simulators", "residual_aware_clustering.utils"]
package-dir = {"residual_aware_clustering" = "."}
